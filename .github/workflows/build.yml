name: build

on:
  schedule:
    - cron: "0 17 * * *"   # UTC 17:00，北京时间 01:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build

env:
  UPSTREAM: https://github.com/vernesong/mihomo
  TAG: Prerelease-Alpha

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      # 定时触发时上游提交未变则跳过
      - name: 检查上游
        id: up
        run: |
          sha=$(git ls-remote "$UPSTREAM" refs/heads/Alpha | cut -f1)
          [ -n "$sha" ]
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$sha" = "$(cat upstream 2>/dev/null)" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取源码
        if: steps.up.outputs.skip != '1'
        run: |
          git clone -q --depth 1 -b Alpha "$UPSTREAM" src
          echo "SHA=$(git -C src rev-parse HEAD)" >> "$GITHUB_ENV"
          # 上游提交加本仓库提交：与上游区分，补丁变更时版本号随之变化，自更新可识别
          echo "VERSION=alpha-smart-$(git -C src rev-parse --short HEAD)-hosts-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        if: steps.up.outputs.skip != '1'
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache-dependency-path: src/go.sum

      - name: 打补丁
        if: steps.up.outputs.skip != '1'
        working-directory: src
        run: |
          all=""
          for p in ../patches/*.patch; do
            name=$(basename "$p" .patch)
            files=$(sed -n 's#^diff --git a/\([^ ]*\) b/.*#\1#p' "$p")
            all="$all $files"
            if git apply "$p"; then
              # 校验备用脚本：在干净副本上写入，结果须与补丁一致
              git worktree add -q --detach ../alt HEAD
              if ! (cd ../alt && python3 ../scripts/apply.py "$name") || [ "$(git -C ../alt diff -- $files)" != "$(git diff -- $files)" ]; then
                echo "::warning::$name: 备用脚本结果与补丁不一致，需更新 scripts/apply.py"
              fi
              git worktree remove --force ../alt
            else
              echo "::warning::$name: 补丁上下文不符，已按锚点写入并重新生成补丁"
              python3 ../scripts/apply.py "$name"
            fi
            # 按本次源码重新生成补丁，构建成功后提交；各补丁修改的文件不重叠
            { sed '/^diff --git/,$d' "$p"; git diff -- $files; } > "$p.new"
            mv "$p.new" "$p"
          done
          # 内核自更新改取本仓库发布
          f=component/updater/update_core.go
          sed -i "s#github.com/vernesong/mihomo/releases/download/$TAG/#github.com/$GITHUB_REPOSITORY/releases/download/$TAG/#" "$f"
          [ "$(grep -c "github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" "$f")" = 2 ]
          [ "$(grep -c 'ApplyHosts(' component/proxydialer/proxydialer.go)" = 2 ]
          [ "$(grep -c 'proxydialer.ApplyHosts(' adapter/adapter.go)" = 2 ]
          test -z "$(gofmt -l $all)"
          git diff --stat

      - name: 测试
        if: steps.up.outputs.skip != '1'
        working-directory: src
        run: |
          # tests/ 按源码路径存放
          cp -r ../tests/. .
          pkgs=$(cd ../tests && find . -name '*_test.go' -exec dirname {} \; | sort -u)
          go vet $pkgs ./adapter ./component/updater
          go test $pkgs

      - name: 编译
        if: steps.up.outputs.skip != '1'
        working-directory: src
        env:
          CGO_ENABLED: "0"
          GOAMD64: v1
        run: |
          go build -tags with_gvisor -trimpath -ldflags "-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=$VERSION' -X 'github.com/metacubex/mihomo/constant.BuildTime=$(date -u)' -w -s -buildid=" -o ../out/mihomo
          cd ../out
          ./mihomo -v
          gzip -c mihomo > "mihomo-linux-amd64-v1-$VERSION.gz"
          echo "$VERSION" > version.txt
          sha256sum *.gz > checksums.txt

      - name: 发布
        if: steps.up.outputs.skip != '1'
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" out/*.gz out/version.txt out/checksums.txt --prerelease --target "$GITHUB_SHA" \
            --title "$VERSION + patches" \
            --notes "源码：vernesong/mihomo@$SHA；补丁：本仓库提交 $GITHUB_SHA 的 patches/"

      # 记录已构建的上游提交与对应补丁，同时保持仓库活动以免定时任务被停用
      - name: 记录
        if: steps.up.outputs.skip != '1'
        run: |
          echo "$SHA" > upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream patches
          git diff --cached --quiet || { git commit -qm "build: $VERSION" && git pull -q --rebase && git push -q; }
